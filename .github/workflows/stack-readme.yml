# scripts/stack-readme, which stack repos run to keep their README's manifest
# section current. scripts/testdata/stack-readme holds a manifest that uses
# every field and the README it gives.
name: stack readme

on:
  push:
    branches: [main]
    paths:
      - scripts/stack-readme
      - scripts/testdata/stack-readme/**
      - .github/workflows/stack-readme.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The test README matches its manifest
        run: scripts/stack-readme --check scripts/testdata/stack-readme
