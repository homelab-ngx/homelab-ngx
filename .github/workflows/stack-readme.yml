# The stack-readme action (.github/actions/stack-readme), which stack repos
# use to keep their README's manifest section current. Its test folder holds
# a manifest that uses every field and the README it gives.
name: stack readme

on:
  push:
    branches: [main]
    paths:
      - .github/actions/stack-readme/**
      - .github/workflows/stack-readme.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The test README matches its manifest
        run: .github/actions/stack-readme/stack-readme --check .github/actions/stack-readme/test
