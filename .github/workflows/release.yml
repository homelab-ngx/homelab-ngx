# Release: start from workflow_dispatch on main with version X.Y.Z (or push
# tag vX.Y.Z on main). Builds the installer and update images, downloads the
# newest published release when one is older than X.Y.Z, runs the VM check
# (routine runs check updates and the new installer in steps 1-10 and 14-19;
# Arch snapshot or boot/fallback changes since the release before, or
# full_check=true, add variant X.Y.Z.1 and run all steps 1-19), signs
# SHA256SUMS, publishes to B2 behind dl.homelab-ngx.com, and pushes tag
# vX.Y.Z. Nothing is uploaded or tagged when the check fails. Runs on main
# also sync missing Arch snapshot packages and update the build caches.
#
# Layout on RELEASE_URL (https://dl.homelab-ngx.com):
#   /<version>/homelab-ngx_<version>.img          installer (the whole disk)
#   /<version>/homelab_<version>.efi              UKI          } an image update
#   /<version>/homelab_<version>.root*.raw        root, verity }
#   /<version>/core/homelab-core_<version>.raw    core extension
#   /<version>/homelab_<version>.manifest         the image's package list (the notes)
#   /<version>/SHA256SUMS, SHA256SUMS.gpg         every file above, signed
#   /versions                                     published versions, oldest first
#   /latest                                       the newest version
#   /changelog.json                               short changelogs of recent releases, for the dashboard
#   /arch/                                        mirrored Arch bootstrap, repo DBs and packages
#   /installer                                    a 302 to the newest installer
# /<version>/ never changes once published (the CDN keeps it a year);
# /changelog.json, /versions and /latest change last, so a host never sees a
# half release.
#
# Two jobs, so that what failed can be run again alone (Re-run failed jobs):
#   release   downloads the previous release, builds, checks, signs, uploads
#             /<version>/ and pushes v<version>. SHA256SUMS goes up last and
#             marks the version as uploaded: run again after that, the job
#             finds it and builds nothing.
#   announce  reads the version back through the CDN, then /versions,
#             /latest, /changelog.json, the GitHub Release and the installer
#             link. Every step can run twice, so a failure here never costs a
#             version number.
#
# Secrets and variables come from homelab-ngx/infra (OpenTofu): RELEASE_B2_KEY_ID,
# RELEASE_B2_KEY (write-only, the release bucket), RELEASE_SIGNING_KEY (subkey
# A0ACE9DE82BCF5DAC1A2478FBD732B3F6BC42EE8 of the key below), RELEASE_B2_BUCKET,
# RELEASE_URL.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z); builds, checks, uploads, tags and announces, or announces again if already uploaded
        required: true
      full_check:
        description: Run the full 19-step image check (including step 11 fallback checks) even when no Arch snapshot or boot/fallback files changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Primary key the signing subkey must belong to (homelab-ngx/infra keys/).
  SIGNING_PRIMARY: 74BE38EB9E1F070C2AF87E4481D74B7E90B6ADB0
  RELEASE_URL: ${{ vars.RELEASE_URL }}
  RELEASE_B2_BUCKET: ${{ vars.RELEASE_B2_BUCKET }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write # push tag vX.Y.Z after check and upload pass
      actions: write # purge older Nix and build root caches on main
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v=$INPUT_VERSION; else v=${GITHUB_REF_NAME#v}; fi
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$v' is not X.Y.Z"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BROKEN=$v.1" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release $v"

      # SHA256SUMS is the last file up. With it there the version is
      # uploaded and never built again: the rest of this job is skipped and
      # announce finishes the release. A new workflow_dispatch release must
      # start from main and must not overwrite an existing tag on another commit.
      - name: Uploaded already?
        id: uploaded
        run: |
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null -w '%{http_code}' "$RELEASE_URL/$VERSION/SHA256SUMS?t=$(date +%s)")
          case $code in
            404)
              echo "already=false" >> "$GITHUB_OUTPUT"
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::a new release must be started from main (got $GITHUB_REF)"; exit 1; }
                if existing=$(git rev-parse --verify --quiet "v$VERSION^{commit}" 2>/dev/null) && [ "$existing" != "$GITHUB_SHA" ]; then
                  echo "::error::tag v$VERSION already exists on commit $existing"
                  exit 1
                fi
              fi
              ;;
            200)
              git rev-parse --verify --quiet "v$VERSION^{commit}" >/dev/null || { echo "::error::$VERSION is uploaded but tag v$VERSION does not exist"; exit 1; }
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "$VERSION is uploaded already: nothing is built" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::$RELEASE_URL/$VERSION/SHA256SUMS answered HTTP $code"; exit 1 ;;
          esac

      - name: Signing key
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}' | grep -qx "$SIGNING_PRIMARY" ||
            { echo "::error::RELEASE_SIGNING_KEY is not a subkey of $SIGNING_PRIMARY"; exit 1; }

      - uses: ./.github/actions/image-env
        id: env
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        with:
          save: ${{ github.ref == 'refs/heads/main' }}

      # The version before this one, from the release server: when older than
      # VERSION, the check boots it and updates to this build, the path real
      # hosts take.
      - name: Previous release
        id: prev
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        run: |
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/latest" -w '%{http_code}' "$RELEASE_URL/latest?t=$(date +%s)")
          case $code in
            200) prev=$(tr -d '[:space:]' < "$RUNNER_TEMP/latest") ;;
            404) prev= ;;
            *) echo "::error::$RELEASE_URL/latest answered HTTP $code"; exit 1 ;;
          esac
          if [ -z "$prev" ] || [ "$prev" = "$VERSION" ] || [ "$(printf '%s\n%s\n' "$prev" "$VERSION" | sort -V | head -n 1)" != "$prev" ]; then
            echo "no older published release before $VERSION: checking $VERSION alone"
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
            echo "prev=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous release $prev"
          d=$RUNNER_TEMP/prev && mkdir -p "$d/core" && cd "$d"
          curl -fsSO --retry 5 --retry-all-errors --retry-delay 5 "$RELEASE_URL/$prev/SHA256SUMS" && curl -fsSO --retry 5 --retry-all-errors --retry-delay 5 "$RELEASE_URL/$prev/SHA256SUMS.gpg"
          gpg --batch --verify SHA256SUMS.gpg SHA256SUMS
          awk '{print $2}' SHA256SUMS | while read -r f; do curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -o "$f" "$RELEASE_URL/$prev/$f"; done
          sha256sum -c --quiet SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/image/out/core"
          cp homelab_"$prev".* "$GITHUB_WORKSPACE/image/out/"
          cp core/homelab-core_"$prev".raw "$GITHUB_WORKSPACE/image/out/core/"
          [ ! -e homelab-ngx_"$prev".img ] || cp homelab-ngx_"$prev".img "$GITHUB_WORKSPACE/image/out/homelab_$prev.raw"
          echo "has_prev=true" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Check scope
        id: scope
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        env:
          FULL_CHECK: ${{ inputs.full_check }}
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          prev_ref=
          [ -z "$PREV" ] || prev_ref="v$PREV"
          out=$(.github/scripts/release-check-scope "$prev_ref" "$GITHUB_SHA")
          printf '%s\n' "$out"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          fallback=$(printf '%s\n' "$out" | sed -n 's/^fallback=//p')
          only=$(printf '%s\n' "$out" | sed -n 's/^only=//p')
          reason=$(printf '%s\n' "$out" | sed -n 's/^reason=//p')
          if [ "$fallback" = true ]; then
            echo "Image check: full (steps 1-19): $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$only" ]; then
            echo "Image check: routine ($only; step 11 fallback and step 13 skipped): $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Image check: single-version (steps 1-8, 13-19): $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: make image
        id: image
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        run: make image VERSION="$VERSION"

      - name: Sync Arch mirror
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.image.outcome == 'success' }}
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.RELEASE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.RELEASE_B2_KEY }}
        run: |
          b2=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#backblaze-b2)/bin/backblaze-b2
          B2_BIN="$b2" scripts/sync-arch-mirror --from-cache /var/cache/homelab-image

      # The check only installs and breaks this one: a copy of the build
      # with a root hash of its own (image/variant.sh), not a second build.
      - name: make image-variant (broken by the check)
        if: ${{ steps.uploaded.outputs.already != 'true' && steps.prev.outputs.has_prev == 'true' && steps.scope.outputs.fallback == 'true' }}
        run: make image-variant FROM="$VERSION" VERSION="$BROKEN"

      - name: make image-check
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        env:
          ONLY: ${{ steps.scope.outputs.only }}
        run: make image-check CPUS="$(nproc)" ONLY="$ONLY"

      # A failed check leaves its logs behind (image/out/vm/logs, a folder per
      # scenario): each boot's serial log, QEMU's log with the machine's
      # events, and the failed machine's journal. They tell a slow boot from
      # one that hung, so they outlive the runner.
      - name: Collect the check's logs
        if: ${{ failure() }}
        run: |
          logs=$RUNNER_TEMP/check-logs && mkdir -p "$logs"
          cp -r image/out/vm/logs/. "$logs/" 2>/dev/null || echo "no logs in image/out/vm/logs"
          { df -h /; echo; ls -lR image/out/vm; } > "$logs/disk.txt" 2>&1 || true

      - name: Keep the check's logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-check-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Sign
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        run: |
          rel=$RUNNER_TEMP/release/$VERSION
          mkdir -p "$rel/core"
          cp image/out/homelab_"$VERSION".raw "$rel/homelab-ngx_$VERSION.img"
          cp image/out/homelab_"$VERSION".efi image/out/homelab_"$VERSION".root*.raw image/out/homelab_"$VERSION".manifest "$rel/"
          cp image/out/core/homelab-core_"$VERSION".raw "$rel/core/"
          cd "$rel"
          LC_ALL=C sha256sum homelab-ngx_"$VERSION".img homelab_"$VERSION".* core/homelab-core_"$VERSION".raw > SHA256SUMS
          gpg --batch --detach-sign -o SHA256SUMS.gpg SHA256SUMS
          gpg --batch --verify SHA256SUMS.gpg SHA256SUMS
          { echo "## $VERSION"; echo '```'; ls -l . core; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The version's files first, then the signature, and SHA256SUMS last:
      # it is what "Uploaded already?" looks for.
      - name: Upload
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.RELEASE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.RELEASE_B2_KEY }}
        run: |
          b2=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#backblaze-b2)/bin/backblaze-b2
          # Every B2 call is tried again on a server error, over 15 minutes
          # (.github/scripts/b2-retry). Four parts at a time instead of the
          # CLI's ten: B2 turns a large file's parts away as too busy most.
          retry=$GITHUB_WORKSPACE/.github/scripts/b2-retry
          "$retry" "$b2" account authorize >/dev/null
          up() { "$retry" "$b2" file upload --no-progress --threads 4 "$RELEASE_B2_BUCKET" "$1" "$2" >/dev/null; }
          # The small text files are text, so a browser shows them instead of
          # saving them.
          uptext() { "$retry" "$b2" file upload --no-progress --threads 4 --content-type "text/plain; charset=utf-8" "$RELEASE_B2_BUCKET" "$1" "$2" >/dev/null; }
          cd "$RUNNER_TEMP/release/$VERSION"
          for f in homelab-ngx_"$VERSION".img homelab_"$VERSION".* core/homelab-core_"$VERSION".raw; do up "$f" "$VERSION/$f"; done
          up SHA256SUMS.gpg "$VERSION/SHA256SUMS.gpg"
          uptext SHA256SUMS "$VERSION/SHA256SUMS"

      - name: Tag
        if: ${{ steps.uploaded.outputs.already != 'true' }}
        run: |
          tag=v$VERSION
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists on origin"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "pushed tag $tag at $GITHUB_SHA"

      # The Nix store saves itself at the end of a green job (image-env).
      # Only the Arch build root is cached (without pacman's downloaded
      # packages); mkosi fetches the snapshot's packages from the Arch mirror
      # on dl.homelab-ngx.com. Saved once make image has passed, even when
      # the check fails.
      - name: Pack the image cache
        id: pack
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.image.outcome == 'success' && steps.env.outputs.image-cache-hit != 'true' }}
        run: |
          snap=$(sed -n 's/^Snapshot=//p' image/base/mkosi.conf)
          dir=homelab-image/buildroot-${snap//\//-}
          sudo test -e "/var/cache/$dir/.ready" || { echo "no build root to save"; exit 0; }
          sudo tar --zstd --numeric-owner --exclude="$dir/var/cache/pacman/pkg/*" \
            -cpf "$RUNNER_TEMP/homelab-image.tar.zst" -C /var/cache "$dir"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/homelab-image.tar.zst"
          ls -lh "$RUNNER_TEMP/homelab-image.tar.zst"
          echo "packed=1" >> "$GITHUB_OUTPUT"

      - name: Save the image cache
        if: ${{ !cancelled() && steps.pack.outputs.packed == '1' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/homelab-image.tar.zst
          key: ${{ steps.env.outputs.image-cache-key }}

      - name: Purge old image caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.pack.outputs.packed == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_KEY: ${{ steps.env.outputs.image-cache-key }}
        run: |
          for prefix in "buildroot-$RUNNER_OS-" "image-$RUNNER_OS-"; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=$prefix" \
              --jq '.actions_caches[] | "\(.id)\t\(.key)"' |
            while IFS=$'\t' read -r id key; do
              [ -n "$id" ] || continue
              [ "$key" = "$KEEP_KEY" ] && continue
              echo "deleting old cache $id ($key)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" || true
            done
          done

  # Everything after the upload. Each step can run again: a version that is
  # listed stays listed once, /latest and the installer link follow the
  # newest version listed (not this run's, so running an old release's job
  # again moves nothing back), and a GitHub Release that exists is kept.
  announce:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub Release
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # The whole history and the tags: the notes list the commits since the
      # release before.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}' | grep -qx "$SIGNING_PRIMARY" ||
            { echo "::error::RELEASE_SIGNING_KEY is not a subkey of $SIGNING_PRIMARY"; exit 1; }

      # What a host will get: the checksums and their signature through the
      # CDN, and one file against them.
      - name: The version downloads and verifies
        run: |
          get() { curl -fsSO --retry 5 --retry-all-errors --retry-delay 5 "$1"; }
          get "$RELEASE_URL/$VERSION/SHA256SUMS" && get "$RELEASE_URL/$VERSION/SHA256SUMS.gpg"
          gpg --batch --verify SHA256SUMS.gpg SHA256SUMS
          get "$RELEASE_URL/$VERSION/homelab_$VERSION.efi"
          grep " homelab_$VERSION.efi\$" SHA256SUMS | sha256sum -c --quiet

      - name: /versions, /latest and /changelog.json
        id: listed
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.RELEASE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.RELEASE_B2_KEY }}
        run: |
          b2=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#backblaze-b2)/bin/backblaze-b2
          retry=$GITHUB_WORKSPACE/.github/scripts/b2-retry
          "$retry" "$b2" account authorize >/dev/null
          uptext() { "$retry" "$b2" file upload --no-progress --content-type "text/plain; charset=utf-8" "$RELEASE_B2_BUCKET" "$1" "$2" >/dev/null; }
          upjson() { "$retry" "$b2" file upload --no-progress --content-type "application/json; charset=utf-8" "$RELEASE_B2_BUCKET" "$1" "$2" >/dev/null; }
          # Only a 404 means no version is published yet: on any other
          # failure stop, or /versions would lose every earlier release.
          code=$(curl -sS --retry 5 --retry-all-errors --retry-delay 5 -o published -w '%{http_code}' "$RELEASE_URL/versions?t=$(date +%s)")
          case $code in
            200) ;;
            404) : > published ;;
            *) echo "::error::$RELEASE_URL/versions answered HTTP $code"; exit 1 ;;
          esac
          { cat published; echo "$VERSION"; } | sed '/^$/d' | sort -uV > versions
          tail -n 1 versions > latest
          # actions/checkout on an annotated tag replaces refs/tags/<tag> with
          # its commit SHA, so fetching tags needs --force to avoid rejecting it.
          git fetch --tags --force origin
          scripts/release-notes --changelog-json versions > changelog.json
          jq -e '.releases | type == "array"' changelog.json >/dev/null
          upjson changelog.json changelog.json
          uptext versions versions
          uptext latest latest
          echo "latest=$(cat latest)" >> "$GITHUB_OUTPUT"
          echo "versions: $(tr '\n' ' ' < versions); latest: $(cat latest)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$VERSION
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "the GitHub Release $tag exists already"
            exit 0
          fi
          # A run by hand is on main, so the notes name the tag's commit.
          git rev-parse --verify --quiet "$tag^{commit}" >/dev/null || git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
          caddy=$(nix eval --raw .#packages.x86_64-linux.core-extension.caddy.version)
          scripts/release-notes "$VERSION" --caddy "$caddy" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md

      # dl.homelab-ngx.com/installer: the Cloudflare redirect rule that
      # homelab-ngx/infra makes, switched off (INSTALLER_REDIRECT names it),
      # points at the newest version's installer and is on. Only here, after
      # the files are published, so the link never points at a missing one.
      # Last: a failure here leaves the release itself published.
      - name: Installer link
        env:
          CF_TOKEN: ${{ secrets.RELEASE_CLOUDFLARE_TOKEN }}
          INSTALLER_REDIRECT: ${{ vars.INSTALLER_REDIRECT }}
          LATEST: ${{ steps.listed.outputs.latest }}
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$INSTALLER_REDIRECT" ] || { echo "::error::RELEASE_CLOUDFLARE_TOKEN or INSTALLER_REDIRECT is not set (homelab-ngx/infra)"; exit 1; }
          target=$RELEASE_URL/$LATEST/homelab-ngx_$LATEST.img
          jq -n --arg host "${RELEASE_URL#https://}" --arg target "$target" '{
            ref: "dl_installer", action: "redirect", enabled: true,
            description: "dl: /installer to the newest installer (set by the release workflow)",
            expression: ("http.host eq \"" + $host + "\" and http.request.uri.path eq \"/installer\""),
            action_parameters: {from_value: {status_code: 302, preserve_query_string: false, target_url: {value: $target}}}
          }' > rule.json
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -o /dev/null -X PATCH "https://api.cloudflare.com/client/v4/$INSTALLER_REDIRECT" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data @rule.json
          for _ in $(seq 1 12); do
            at=$(curl -fsS -o /dev/null -w '%{redirect_url}' "$RELEASE_URL/installer?t=$(date +%s)" || true)
            [ "$at" = "$target" ] && { echo "$RELEASE_URL/installer -> $at"; exit 0; }
            sleep 5
          done
          echo "::error::$RELEASE_URL/installer redirects to '$at', not $target"; exit 1
