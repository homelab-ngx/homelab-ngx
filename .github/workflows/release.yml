# Release: a tag vX.Y.Z on main builds the installer and update images, checks
# them in a VM, signs SHA256SUMS and publishes to B2 behind dl.homelab-ngx.com.
# The GitHub Release holds only the notes. (#2; the hosted runner was proven by
# the image spike, run 44339328373.)
#
# Layout on RELEASE_URL (https://dl.homelab-ngx.com):
#   /<version>/homelab-ngx_<version>.img          installer (the whole disk)
#   /<version>/homelab_<version>.efi              UKI          } an image update
#   /<version>/homelab_<version>.root*.raw        root, verity }
#   /<version>/core/homelab-core_<version>.raw    core extension
#   /<version>/SHA256SUMS, SHA256SUMS.gpg         every file above, signed
#   /versions                                     published versions, oldest first
#   /latest                                       the newest version
#   /installer                                    a 302 to the newest installer
# /<version>/ never changes once published (the CDN keeps it a year);
# /versions and /latest change last, so a host never sees a half release.
#
# Secrets and variables come from homelab-ngx/infra (OpenTofu): RELEASE_B2_KEY_ID,
# RELEASE_B2_KEY (write-only, the release bucket), RELEASE_SIGNING_KEY (subkey
# A0ACE9DE82BCF5DAC1A2478FBD732B3F6BC42EE8 of the key below), RELEASE_B2_BUCKET,
# RELEASE_URL.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Primary key the signing subkey must belong to (homelab-ngx/infra keys/).
  SIGNING_PRIMARY: 74BE38EB9E1F070C2AF87E4481D74B7E90B6ADB0
  RELEASE_URL: ${{ vars.RELEASE_URL }}
  RELEASE_B2_BUCKET: ${{ vars.RELEASE_B2_BUCKET }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write # the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
            [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
            echo "DRY_RUN=" >> "$GITHUB_ENV"
          else
            v=0.0.$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M)
            echo "DRY_RUN=1" >> "$GITHUB_ENV"
          fi
          # image-check breaks the newest of its three versions on purpose: a
          # throwaway build above this one, never published.
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BROKEN=$v.1" >> "$GITHUB_ENV"
          echo "release $v (ref $GITHUB_REF_TYPE $GITHUB_REF_NAME)"

      - name: Not published yet
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$RELEASE_URL/$VERSION/SHA256SUMS?t=$(date +%s)")
          [ "$code" = 404 ] || { echo "::error::$VERSION is already published (HTTP $code)"; exit 1; }

      - name: Signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}' | grep -qx "$SIGNING_PRIMARY" ||
            { echo "::error::RELEASE_SIGNING_KEY is not a subkey of $SIGNING_PRIMARY"; exit 1; }

      # The runner image carries ~30 GB of toolchains this build never uses;
      # the build and the check need ~28 GB.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: KVM and systemd-nspawn
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq systemd-container >/dev/null

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The version before this one, from the release server: the check boots
      # it and updates to this release, the path real hosts take. Before the
      # first release there is none, and a 0.0.0 build stands in.
      - name: Previous release
        run: |
          prev=$(curl -fsS "$RELEASE_URL/latest?t=$(date +%s)" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "no release yet: building 0.0.0 as the version before"
            make image VERSION=0.0.0
            exit 0
          fi
          echo "previous release $prev"
          d=$RUNNER_TEMP/prev && mkdir -p "$d/core" && cd "$d"
          curl -fsSO "$RELEASE_URL/$prev/SHA256SUMS" && curl -fsSO "$RELEASE_URL/$prev/SHA256SUMS.gpg"
          gpg --batch --verify SHA256SUMS.gpg SHA256SUMS
          awk '{print $2}' SHA256SUMS | while read -r f; do curl -fsS -o "$f" "$RELEASE_URL/$prev/$f"; done
          sha256sum -c --quiet SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/image/out/core"
          cp homelab_"$prev".* "$GITHUB_WORKSPACE/image/out/"
          cp core/homelab-core_"$prev".raw "$GITHUB_WORKSPACE/image/out/core/"
          # The installer is published as homelab-ngx_<v>.img (0.1.0 and
          # before: homelab_<v>.raw, copied above); the check boots it as the
          # build names it.
          [ ! -e homelab-ngx_"$prev".img ] || cp homelab-ngx_"$prev".img "$GITHUB_WORKSPACE/image/out/homelab_$prev.raw"

      - name: make image
        run: make image VERSION="$VERSION"

      - name: make image (throwaway, broken by the check)
        run: make image VERSION="$BROKEN"

      - name: make image-check
        run: make image-check

      - name: Sign
        run: |
          rel=$RUNNER_TEMP/release/$VERSION
          mkdir -p "$rel/core"
          cp image/out/homelab_"$VERSION".raw "$rel/homelab-ngx_$VERSION.img"
          cp image/out/homelab_"$VERSION".efi image/out/homelab_"$VERSION".root*.raw "$rel/"
          cp image/out/core/homelab-core_"$VERSION".raw "$rel/core/"
          cd "$rel"
          sha256sum homelab-ngx_"$VERSION".img homelab_"$VERSION".* core/homelab-core_"$VERSION".raw > SHA256SUMS
          gpg --batch --detach-sign -o SHA256SUMS.gpg SHA256SUMS
          gpg --batch --verify SHA256SUMS.gpg SHA256SUMS
          { echo "## $VERSION"; echo '```'; ls -l . core; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The version's files first, SHA256SUMS(.gpg) after them, then /versions
      # and /latest once the files download and verify through the CDN.
      - name: Publish
        if: env.DRY_RUN == ''
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.RELEASE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.RELEASE_B2_KEY }}
        run: |
          b2=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#backblaze-b2)/bin/backblaze-b2
          $b2 account authorize >/dev/null
          up() { $b2 file upload --no-progress "$RELEASE_B2_BUCKET" "$1" "$2" >/dev/null; }
          # The small text files are text, so a browser shows them instead of
          # saving them.
          uptext() { $b2 file upload --no-progress --content-type "text/plain; charset=utf-8" "$RELEASE_B2_BUCKET" "$1" "$2" >/dev/null; }
          cd "$RUNNER_TEMP/release/$VERSION"
          for f in homelab-ngx_"$VERSION".img homelab_"$VERSION".* core/homelab-core_"$VERSION".raw; do up "$f" "$VERSION/$f"; done
          uptext SHA256SUMS "$VERSION/SHA256SUMS"
          up SHA256SUMS.gpg "$VERSION/SHA256SUMS.gpg"

          v=$RUNNER_TEMP/verify && mkdir -p "$v" && cd "$v"
          curl -fsSO "$RELEASE_URL/$VERSION/SHA256SUMS" && curl -fsSO "$RELEASE_URL/$VERSION/SHA256SUMS.gpg"
          gpg --batch --verify SHA256SUMS.gpg SHA256SUMS
          curl -fsSO "$RELEASE_URL/$VERSION/homelab_$VERSION.efi"
          grep " homelab_$VERSION.efi\$" SHA256SUMS | sha256sum -c --quiet

          { curl -fsS "$RELEASE_URL/versions?t=$(date +%s)" 2>/dev/null || true; echo "$VERSION"; } | sed '/^$/d' | sort -uV > versions
          echo "$VERSION" > latest
          uptext versions versions
          uptext latest latest

      - name: GitHub Release
        if: env.DRY_RUN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Installer: $RELEASE_URL/$VERSION/homelab-ngx_$VERSION.img (write it to a USB stick; $RELEASE_URL/installer is always the newest).
          Files and signed checksums: $RELEASE_URL/$VERSION/SHA256SUMS
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes

      # dl.homelab-ngx.com/installer: the Cloudflare redirect rule that
      # homelab-ngx/infra makes, switched off (INSTALLER_REDIRECT names it),
      # now points at this release's installer and is on. Only here, after
      # the files are published, so the link never points at a missing one.
      # Last: a failure here leaves the release itself published.
      - name: Installer link
        if: env.DRY_RUN == ''
        env:
          CF_TOKEN: ${{ secrets.RELEASE_CLOUDFLARE_TOKEN }}
          INSTALLER_REDIRECT: ${{ vars.INSTALLER_REDIRECT }}
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$INSTALLER_REDIRECT" ] || { echo "::error::RELEASE_CLOUDFLARE_TOKEN or INSTALLER_REDIRECT is not set (homelab-ngx/infra)"; exit 1; }
          target=$RELEASE_URL/$VERSION/homelab-ngx_$VERSION.img
          jq -n --arg host "${RELEASE_URL#https://}" --arg target "$target" '{
            ref: "dl_installer", action: "redirect", enabled: true,
            description: "dl: /installer to the newest installer (set by the release workflow)",
            expression: ("http.host eq \"" + $host + "\" and http.request.uri.path eq \"/installer\""),
            action_parameters: {from_value: {status_code: 302, preserve_query_string: false, target_url: {value: $target}}}
          }' > rule.json
          curl -fsS -o /dev/null -X PATCH "https://api.cloudflare.com/client/v4/$INSTALLER_REDIRECT" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data @rule.json
          for _ in $(seq 1 12); do
            at=$(curl -fsS -o /dev/null -w '%{redirect_url}' "$RELEASE_URL/installer?t=$(date +%s)" || true)
            [ "$at" = "$target" ] && { echo "$RELEASE_URL/installer -> $at"; exit 0; }
            sleep 5
          done
          echo "::error::$RELEASE_URL/installer redirects to '$at', not $target"; exit 1

      - name: Dry run
        if: env.DRY_RUN != ''
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.RELEASE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.RELEASE_B2_KEY }}
        run: |
          b2=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#backblaze-b2)/bin/backblaze-b2
          $b2 account authorize >/dev/null && echo "B2 key authorizes"
          $b2 bucket get "$RELEASE_B2_BUCKET" >/dev/null && echo "bucket $RELEASE_B2_BUCKET is visible to the key"
          echo "dry run: $VERSION built, checked and signed; nothing published" | tee -a "$GITHUB_STEP_SUMMARY"
