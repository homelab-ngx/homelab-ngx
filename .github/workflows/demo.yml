# The demo: the dashboard built in demo mode (apps/dashboard/src/demo), where
# a made-up host in the browser answers every call, published to GitHub
# Pages. It follows main. The Pages site and its domain are set up outside
# this repo; until they are, the deploy job fails and the build still passes.
name: demo

on:
  push:
    branches: [main]
    paths:
      - apps/dashboard/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Build the demo
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build:demo

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/dashboard/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
