# The runner set up to build and check the image: room on the disk, KVM and
# systemd-nspawn, Nix, and two caches.
#   - The Nix store: the core extension's builds, bcdu's above all (a static
#     Rust build of a pinned input, ~10 minutes on a hosted runner).
#   - /var/cache/homelab-image: image/build.sh's Arch build root and mkosi's
#     packages, per snapshot (the bootstrap and ~290 downloads from the Arch
#     archive).
# A run restores the newest cache whose key shares the prefix. Only a run on
# main saves (save: true): a cache saved on a tag is seen by that tag alone,
# one saved on main by every ref. image-check.yml saves; release.yml reads.
name: image build environment
description: Room, KVM, systemd-nspawn, Nix and the build caches for make image and make image-check
inputs:
  save:
    description: Save the Nix store at the end of a green job, and purge the older Nix caches (needs actions write). The image cache is saved by the caller (image-cache-key).
    default: 'false'
outputs:
  image-cache-key:
    description: The key to save /var/cache/homelab-image under
    value: ${{ steps.image-cache.outputs.cache-primary-key }}
  image-cache-hit:
    description: '"true" when the image cache was restored by that exact key'
    value: ${{ steps.image-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # The runner image carries ~30 GB of toolchains this build never uses;
    # the build and the check need ~28 GB.
    - name: Free disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune -af >/dev/null 2>&1 || true
        df -h /

    - name: KVM and systemd-nspawn
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
        sudo apt-get update -qq && sudo apt-get install -y -qq systemd-container >/dev/null

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Nix store cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'apps/core/go.sum', 'apps/dashboard/package-lock.json') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        save: ${{ inputs.save }}
        purge: ${{ inputs.save }}
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    - name: Image cache key
      id: image-key
      shell: bash
      run: |
        snapshot=$(sed -n 's/^Snapshot=//p' image/base/mkosi.conf)
        echo "prefix=image-$RUNNER_OS-${snapshot//\//-}-" >> "$GITHUB_OUTPUT"

    # A tarball, not the folder: the build root is root's, which the cache
    # action (the runner's user) can neither read nor restore.
    - name: Image cache
      id: image-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/homelab-image.tar.zst
        key: ${{ steps.image-key.outputs.prefix }}${{ hashFiles('image/build.sh', 'image/base/mkosi.conf') }}
        restore-keys: ${{ steps.image-key.outputs.prefix }}

    - name: Unpack the image cache
      if: steps.image-cache.outputs.cache-matched-key != ''
      shell: bash
      run: |
        sudo mkdir -p /var/cache
        sudo tar --zstd --numeric-owner -xpf "$RUNNER_TEMP/homelab-image.tar.zst" -C /var/cache
        rm -f "$RUNNER_TEMP/homelab-image.tar.zst"
        sudo du -sh /var/cache/homelab-image
