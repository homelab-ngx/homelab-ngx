# The default initrd, plus: a failed boot (a root that does not mount, as a
# corrupt or unverifiable slot) reboots instead of waiting in an emergency
# shell, so systemd-boot counts the try down and falls back to the slot
# before. And: the root comes from the disk the boot loader started from
# (homelab-loader-disk.service), and the machine ID from /var
# (homelab-machine-id.service); both are in mkosi.extra here.
[Content]
# The boot splash's theme and settings, from the image's own tree
# (InitrdProfiles=plymouth in mkosi.conf brings plymouth itself). And the
# image's udev rules, which say whose partition a contested link points at
# (61-homelab-disk.rules): the initrd needs the same answer as the system.
ExtraTrees=%D/mkosi.extra/usr/share/plymouth:/usr/share/plymouth
           %D/mkosi.extra/etc/plymouth:/etc/plymouth
           %D/mkosi.extra/usr/lib/udev/rules.d:/usr/lib/udev/rules.d
