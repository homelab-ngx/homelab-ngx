# Everything of the host's own, the Nix store the stacks build into among it
# (/var/nix, mounted at /nix); the rest of the disk. It starts with the core
# extension the installer runs, copied from the running stick (not the
# stick's installer marker), so the installed host has its daemon.
[Partition]
Type=var
Label=var
Format=ext4
# At least 49 GiB: with the other partitions' minimums the install then needs
# 57.4 GiB, which a disk sold as 64 GB (59.6 GiB) has. The installer's
# MinBytes (internal/installer/assess.go) is that sum with room to spare.
SizeMinBytes=49G
CopyFiles=/var/lib/extensions.d:/lib/extensions.d
CopyFiles=/var/lib/extensions:/lib/extensions
