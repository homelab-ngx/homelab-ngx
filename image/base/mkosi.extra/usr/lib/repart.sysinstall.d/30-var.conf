# Everything of the host's own; the rest of the disk. It starts with the core
# extension the installer runs, copied from the running stick (not the
# stick's installer marker), so the installed host has its daemon.
[Partition]
Type=var
Label=var
Format=ext4
SizeMinBytes=39G
CopyFiles=/var/lib/extensions.d:/lib/extensions.d
CopyFiles=/var/lib/extensions:/lib/extensions
