# The installer runs systemd-repart with these definitions on the target
# disk: erased (--empty=force) or into its free space next to another OS
# (--empty=allow); they sit where systemd-sysinstall looks for them. repart
# matches existing partitions to these by type and would grow an existing ESP
# to this size, so the installer leaves this file out when the install uses
# an ESP that is already there (one with 400 MB free; it refuses a smaller
# one). A new ESP is 1 GB: two kernels and room for them to grow. The
# installer then puts systemd-boot and the kernel on it (bootctl install,
# EFI/Linux).
# The minimums add up to the 64 GB an install needs.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=1G
SizeMaxBytes=1G
