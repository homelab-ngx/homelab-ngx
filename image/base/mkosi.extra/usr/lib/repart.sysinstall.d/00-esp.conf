# The installer runs systemd-repart with these definitions on the target
# disk: erased (--empty=force) or into its free space next to another OS
# (--empty=allow); they sit where systemd-sysinstall looks for them. repart
# matches existing partitions to these by type, so on a disk that has an ESP
# that ESP is used as it is (300 MB or more; a smaller one fails the install's
# dry run). A new ESP gets 1 GB. The installer then puts systemd-boot and the
# kernel on it (bootctl install, EFI/Linux).
# The minimums add up to the 64 GB an install needs.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=300M
SizeMaxBytes=1G
