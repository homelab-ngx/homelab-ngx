# The serial console: serial-getty@'s own agetty, through
# usr/lib/homelab/console-login, which logs root in on the installer stick.
# Only ttyS0 has one (system-preset): systemd.getty_auto=0 keeps others off.
[Service]
ExecStart=
ExecStart=-/usr/lib/homelab/console-login --noreset --noclear --keep-baud 115200,57600,38400,9600 - ${TERM}
