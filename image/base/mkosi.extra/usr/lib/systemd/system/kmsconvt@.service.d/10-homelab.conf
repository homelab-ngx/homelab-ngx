# agetty logs in, inside kmscon's terminal, so the console shows the login
# banner (/etc/issue) as getty@ does. It clears the screen, so the banner it
# redraws when the address changes replaces the one before. It logs root in
# (usr/lib/homelab/console-login).
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --vt=%I --no-switchvt --login -- /usr/lib/homelab/console-login - kmscon
