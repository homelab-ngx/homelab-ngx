d /var/roothome 0700 root root -
C /var/roothome/.bash_profile - - - - /etc/skel/.bash_profile
d /var/lib/sshd 0700 root root -
d /var/mnt 0755 root root -
d /var/lib/homelab 0755 root root -
d /var/lib/homelab/caddy 0755 root root -
# A host installed from a build whose accounts had other ids (before they
# were fixed, sysusers.d/homelab.conf): what the daemon wrote for Caddy and
# for itself gets the group by name again, before either starts. Caddy's own
# state is put right by its unit (StateDirectory=).
z /var/lib/homelab/caddy/*.caddy - root caddy -
z /var/lib/homelab/caddy/http - root homelab-daemon -
z /var/lib/homelab/appdata - root homelab-daemon -
z /var/lib/homelab/appdata/stacks - root homelab-daemon -
z /var/lib/sops-age - root homelab-daemon -
z /var/lib/sops-age/keys.txt - root homelab-daemon -
d /var/lib/homelab/updates 0755 root root -
d /var/lib/homelab/updates/core 0755 root root -
d /var/lib/extensions 0755 root root -
d /var/lib/extensions.d 0755 root root -
d /var/lib/homelab-stack-routes 0755 root root -
d /var/cache/homelab-nixd 0750 homelab-nixd homelab-nixd -
