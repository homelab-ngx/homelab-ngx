# The image's own accounts have fixed ids. /var outlives an image, and
# files there are owned by number: left to be picked, the numbers move when
# a package that brings an account of its own is added, and after the update
# Caddy cannot read its own configuration. These are the ids 0.3.0 has. The
# image check fails when one of them is anything else.
g homelab-daemon 957
u caddy 956 "Caddy" /var/lib/caddy
u homelab-nixd 955 "Stack editor language server" /var/cache/homelab-nixd
