# Host keys live on /var: the root file system is read-only. Root's key
# comes as the systemd credential ssh.authorized_keys.root (written to
# /root/.ssh by systemd-tmpfiles), set by the installer.
HostKey /var/lib/sshd/ssh_host_ed25519_key
PermitRootLogin prohibit-password
# Keys only: no password, and no keyboard-interactive (PAM) prompt either.
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
# A client that has gone away is noticed after three minutes, and the probes
# keep an idle session open through NAT.
ClientAliveInterval 60
# Keys set in the dashboard (Settings, Host), written by homelab-daemon.
AuthorizedKeysFile .ssh/authorized_keys /var/lib/homelab/ssh/authorized_keys
