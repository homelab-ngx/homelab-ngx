# Unix group containing the Nix build user accounts
build-users-group = nixbld
# `nix shell nixpkgs#<tool>` for a tool the image does not have.
experimental-features = nix-command flakes
# The store shares /var with the host's data. A build that leaves less than
# 4 GB free collects garbage until 8 GB are; the daemon collects after a
# stack changes as well.
min-free = 4294967296
max-free = 8589934592
