# The image host (#95): Arch from a dated snapshot, read-only verity root in
# two slots, updated with systemd-sysupdate. The core (daemon, dashboard,
# Caddy) is not in here: it is the homelab-core system extension, built by
# Nix (.#core-extension). Build with `make image`.

[Distribution]
Distribution=arch
# Every package, the kernel and the bcachefs module pair included, comes
# from this day's archive. Moving it is the image's package update.
Snapshot=2026/11/15

[Output]
ImageId=homelab
Format=disk
SplitArtifacts=uki,partitions
CompressOutput=no
# The package list of the build, homelab_VERSION.manifest: a release publishes
# it, and the next release's notes show what changed (scripts/release-notes).
ManifestFormat=json
# Fixed, so partition UUIDs (and with them the image) are the same for the
# same inputs. The installer medium's partition table UUID follows from it,
# and usr/lib/udev/rules.d/61-homelab-disk.rules names that UUID: a new seed
# needs the new UUID there (image/check.sh compares the two).
Seed=b2a1f0d4-90a5-4c2e-9d55-1f0c2a3e9090

[Build]
# mkosi runs in an Arch build root of the same snapshot (image/build.sh),
# which is its tools tree.
ToolsTree=
History=no

# Firmware (Packages= below) comes in Arch's vendor packages. In: Intel and
# Realtek (graphics, network cards), AMD graphics old and new (an AMD GPU
# without it stays on the firmware's framebuffer, with no video decoding for
# a stack), Broadcom's wired cards (tg3, bnx2, bnx2x) and "other", where the
# remaining wired cards' files are (Chelsio, Myricom, NetXen). Out: wireless,
# sound, Nvidia, and the large packages for switch chips and SmartNICs
# (mellanox, marvell, nfp, liquidio) and Fibre Channel cards (qlogic).
# ConnectX, Intel and Aquantia cards and the RAID controllers need no file.
[Content]
SourceDateEpoch=1763164800
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v
# roothash= is added by mkosi from the verity partitions; it pins each UKI to
# its own root. The machine ID comes from the firmware in the initrd and on
# the installer medium; an installed host takes its own from /var
# (mkosi.initrd.conf, homelab-machine-id.service).
# quiet splash: plymouth's splash (etc/plymouth) instead of boot messages;
# Esc shows them. The serial console keeps its text. restart-on-corruption:
# reboot immediately on dm-verity corruption so systemd-boot falls back in
# seconds rather than waiting on device timeouts. vt.default_*: the
# console's 16 colours, in the dashboard's (black #101317, blue #5aa9e6,
# light grey #d8dde3), for the login banner (etc/issue).
KernelCommandLine=systemd.machine_id=firmware console=ttyS0 console=tty0 loglevel=3 systemd.getty_auto=0
        systemd.verity_root_options=restart-on-corruption
        quiet splash plymouth.ignore-serial-consoles
        vt.default_red=16,229,124,224,90,180,92,216,92,240,155,240,140,205,138,244
        vt.default_grn=19,112,199,184,169,140,198,221,102,149,220,208,200,176,223,246
        vt.default_blu=23,122,154,102,230,230,201,227,114,156,180,138,245,240,224,248
# The initrd shows the splash from its start, with the same theme.
InitrdProfiles=plymouth
# The initrd needs storage and the basics; GPU, wireless and sound firmware
# would add hundreds of MB to every UKI.
# mkosi's default list finds a root on NVMe, AHCI, virtio and a USB stick
# (usb-storage), and little else. The rest is named here, so the root is
# also found on: a USB disk that speaks UAS (most USB 3 enclosures), eMMC
# and SD (sdhci), SATA and IDE controllers without AHCI, RAID and SAS
# controllers (LSI/Broadcom, HPE, Adaptec/Microchip, Areca, 3ware, Intel and
# Marvell SAS), UFS, and the disks Hyper-V, VMware and Xen give a guest.
# An entry is a folder (with the slash) or one module's whole name: a part
# of a name takes nothing in. image/check.sh looks for one module of each in
# the UKI and boots behind three of the controllers. Fibre Channel and iSCSI
# roots are not covered.
KernelInitrdModules=default
        /drivers/usb/storage/
        /drivers/mmc/core/
        /drivers/mmc/host/sdhci
        /drivers/mmc/host/sdhci-pci
        /drivers/mmc/host/sdhci-acpi
        /drivers/mmc/host/cqhci
        /drivers/ata/
        /drivers/scsi/megaraid/
        /drivers/scsi/mpt3sas/
        /drivers/message/fusion/
        /drivers/scsi/hpsa
        /drivers/scsi/smartpqi/
        /drivers/scsi/aacraid/
        /drivers/scsi/arcmsr/
        /drivers/scsi/3w-9xxx
        /drivers/scsi/3w-sas
        /drivers/scsi/3w-xxxx
        /drivers/scsi/isci/
        /drivers/scsi/mvsas/
        /drivers/scsi/pm8001/
        /drivers/ufs/
        /drivers/scsi/hv_storvsc
        /drivers/scsi/vmw_pvscsi
        /drivers/block/xen-blkfront
        -/drivers/gpu/
        -/drivers/net/wireless/
        -/sound/
Hostname=homelab
Locale=C.UTF-8
Timezone=UTC
WithDocs=no
# ncurses has the entries for WezTerm, Alacritty, foot and the terminals
# that send xterm-256color. Ghostty and kitty send their own TERM, and root
# cannot add one over SSH: /usr is read-only and root's ncurses ignores
# ~/.terminfo and $TERMINFO, so their entries come in the image.
# For working over SSH: rsync (needed at both ends), tmux (a session that
# outlives the connection), nano (the default editor, etc/profile.d),
# ripgrep, tab completion, and which, hostname and diff, which base leaves
# out. Other tools are a `nix shell nixpkgs#<tool>` away (etc/nix/nix.conf).
Packages=
        base
        systemd
        systemd-sysvcompat
        linux
        intel-ucode
        amd-ucode
        linux-firmware-intel
        linux-firmware-realtek
        linux-firmware-amdgpu
        linux-firmware-radeon
        linux-firmware-amd
        linux-firmware-broadcom
        linux-firmware-other
        bcachefs-tools
        nix
        openssh
        iproute2
        nftables
        wireguard-tools
        tailscale
        cloudflared
        git
        rclone
        restic
        smartmontools
        udisks2
        efibootmgr
        util-linux
        e2fsprogs
        dosfstools
        sqlite
        curl
        jq
        less
        vim
        nano
        rsync
        tmux
        ripgrep
        bash-completion
        which
        inetutils
        diffutils
        ghostty-terminfo
        kitty-terminfo
        plymouth
        terminus-font
        kmscon
        fontconfig
        ttf-jetbrains-mono-nerd
        qrencode
# Nothing on the host reads these: messages stay in English (C.UTF-8 is
# glibc's own), nothing compiles against the root's headers (Nix brings its
# own), and nothing introspects GObject libraries. (The console's font is
# trimmed in mkosi.finalize.chroot.) kmscon draws without OpenGL (drm2d):
# its GL modules only log that libGLESv2 is missing.
RemoveFiles=
        /usr/include
        /usr/share/locale/*
        /usr/share/i18n
        /usr/share/gir-1.0
        /usr/lib/kmscon/mod-gltex.so
        /usr/lib/kmscon/mod-drm3d.so
BuildPackages=
        linux-headers
        bcachefs-dkms
        dkms
        gcc
        make
