# The Nix store's partition. The disk image is the installer medium, whose
# installer mode builds no stacks: it only has to mount. An installed
# system's /nix comes from usr/lib/repart.sysinstall.d (16 to 32 GB). Its own
# partition type: repart matches partitions by type, and linux-generic is
# every other Linux disk's.
[Partition]
Type=073d2b22-9f7e-4817-8d45-890277f7dd55
Label=nix
Format=ext4
SizeMinBytes=32M
SizeMaxBytes=32M
SplitName=-
