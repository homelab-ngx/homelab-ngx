# The installer medium's ESP: systemd-boot and one kernel. An install makes
# its own ESP (usr/lib/repart.sysinstall.d).
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
# One UKI (about 140 MB) and systemd-boot. A fixed size: repart's vfat
# minimizing guesses twice the contents and then fails to fit the image.
SizeMinBytes=200M
SizeMaxBytes=200M
# Only the whole disk has it: an update takes the UKI, and an install makes
# its own ESP, so no split file.
SplitName=-
