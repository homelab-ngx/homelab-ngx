# Slot A: the root file system, read-only erofs, checked by dm-verity. The
# UKI carries the root hash, and the partition UUIDs are derived from it, so
# each UKI finds exactly its own root. Split files carry the UUID (%U) for
# sysupdate to keep. The partition is as small as its compressed contents:
# an install copies it into a 4 GB slot (usr/lib/repart.sysinstall.d), and
# sysupdate writes an update's (homelab_VERSION.root.UUID.raw) into one.
[Partition]
Type=root
Label=homelab_%A
Format=erofs
Compression=lz4hc
CopyFiles=/
ExcludeFiles=/efi/
ExcludeFiles=/boot/
ExcludeFiles=/var/
Verity=data
VerityMatchKey=root
Minimize=best
SplitName=root.%U
