# Everything of the host's own, the Nix store among it: grows to the end of
# the disk at first boot.
# The disk image is also the installer stick: its /var holds the core
# extension (build.sh puts it in the tree) and the marker that starts the
# daemon in installer mode.
[Partition]
Type=var
Label=var
Format=ext4
SizeMinBytes=128M
SplitName=-
CopyFiles=/var/lib/extensions.d:/lib/extensions.d
CopyFiles=/var/lib/extensions:/lib/extensions
CopyFiles=/var/lib/homelab/installer:/lib/homelab/installer
